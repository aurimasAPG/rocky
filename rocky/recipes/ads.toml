# Rocky recipe: Facebook / Instagram ads, delivered as a page a marketer opens.
# No deck, no spreadsheet: the ad_board tool checks the copy with code and
# writes deliverables/ads.html. A goal that names a deck or a sheet goes to the
# marketing recipe instead.

name = "ads"
description = "Facts → ads → visuals, handed over as one page showing each ad in the feed. Facebook, Instagram, Meta ads."
deliverable_path = "deliverables/ads.html"
notes = "Facts go to runs/notes/facts.md. The ad_board tool writes deliverables/ads.html and runs/notes/ads.json. Visuals are deliverables/visual-<ad number>.png. No deck or spreadsheet."
cost_multiplier = 1.0

[match]
hints = [
  "facebook ad", "facebook reklam", "fb reklam", "fb ad", "meta ad", "meta reklam",
  "instagram ad", "instagram reklam", "ad copy", "ad creative", "reklamų kampanij",
  "reklamų variant", "reklamos variant", "reklamos tekst", "reklamų tekst",
]
unless = ["pptx", "skaidr", "pristatym", "deck", "xlsx", "excel"]

[[steps]]
id = 1
title = "Facts"
depends_on = []
requires = ["fact", "fakt", "research", "tyrim"]
writes = ["runs/notes/facts.md"]
detail = """skill_view marketing-strategy. Read the site the goal names with web_fetch: home, services or pricing, about, one case page. \
Use at most ten tool calls in all and write as soon as you have enough. \
Write runs/notes/facts.md for: {goal}. Start it with a line `Job: ` saying what the customer is trying to get done, a line `Pitch: ` quoting the main message the site uses today, then two or three `Segment: ` lines, each an outcome a group struggles to reach and the circumstance that identifies them, with its rough size, buying power and cost to reach, marked as estimates unless sourced. Drop a segment too small or too poor to pay back. Then one `Match: ` line per product on sale naming the segment it serves best. Then what is sold, to whom, the offer, prices, where and how buyers get it (delivery, outlets, booking), proof numbers, tone, brand colours as hex: \
one line per fact, with the URL it came from. Add a `Growth: ` line: penetration if this campaign sells more where the brand already sells, development if it takes the product to new buyers or a new country. For development add a `Reach: ` line with the evidence and URL that those buyers can be reached. Add two or three `Table stake: ` lines: an outcome customers expect from anyone in this category and already get from competitors, its minimum acceptable level, and whether this brand meets it (met, unmet or unknown). If the goal asks about competitors, add two or three with URLs. \
Mark what you could not confirm. No invented numbers, quotes or reviews. \
If the ads will carry a price, a discount or a promotion, skill_view marketing-numbers and check the offer with unit_economics before writing it into the facts."""

[[steps]]
id = 2
title = "Ads"
depends_on = [1]
requires = ["ad_board"]
writes = ["deliverables/ads.html", "runs/notes/ads.json"]
detail = """skill_view meta-ads-copy if it is listed. Using only runs/notes/facts.md, write three ads (or the number the goal names) with different angles built on the Job line for: {goal}. \
Give each ad one Segment line from the facts and state that struggle and circumstance in its audience. Fill segment for each ad: size, buying_power, reach_cost, distinct. \
With more than one ad, ad 1 is the control: the Pitch line turned into an ad, test_role control. The others are challengers, test_role challenger: \
each about an outcome the product already delivers that its segment struggles to reach, with no promise the product would have to change to keep. \
Call ad_board with brand, url, ads (primary_text, headline, description, cta, angle, audience, test_role, segment, mix), growth (kind, reach), table_stakes and claims. No ad leads on a table stake. \
Fill mix for each ad from the facts: product, price, place, with product being what the Match line gives for that ad's segment. If the buyer could not experience the ad's promise with that offer, change the ad. \
Put every number in the copy into claims with its URL from runs/notes/facts.md, or write the copy without digits. \
When ad_board lists problems, fix them and call it again with the whole pack. Do not write the page yourself. \
Then run page_inspect for each ad against the url the ads link to (headline, primary_text, cta, price, audience, offer); \
a block (price the page does not show, no button or form) means the ad or the landing page must change before handing over — say which in the ad's angle and call ad_board again."""

[[steps]]
id = 3
title = "Visuals"
depends_on = [2]
requires = ["visual", "vizual", "image"]
writes = ["deliverables/visual-1.png"]
detail = """One square image per ad: image_generate with aspect_ratio 1:1 and path deliverables/visual-1.png for ad 1, \
deliverables/visual-2.png for ad 2, and so on. Read the ads in runs/notes/ads.json and the brand colours in runs/notes/facts.md. \
One clear subject that carries the ad's angle. No text in the image, no invented logos or awards. \
vision_analyze each one once and regenerate it once only if it is wrong. They appear on the page by themselves."""
