[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rocky"
version = "0.1.0"
description = "rocky — OpenRouter agent orchestrator: plan, work, verify."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  { name = "Aurimas Gircys", email = "aurimas@apgmedia.lt" },
]
requires-python = ">=3.11"
keywords = ["openrouter", "agent", "orchestrator", "cli", "tui", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "rich>=13",
  "textual>=2.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "openpyxl>=3.1",
  "markitdown>=0.1",
  "pypdf>=5.0",
  "reportlab>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
browser = ["playwright>=1.49"]

[project.scripts]
rocky = "rocky.cli:main"

[tool.setuptools.packages.find]
include = ["rocky*"]

[tool.setuptools.package-data]
rocky = ["static/*", "skills/*/SKILL.md", "recipes/*.toml", "HELP.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
